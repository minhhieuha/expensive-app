<header class="app-header">
  <div class="header-content">
    <a routerLink="/" class="brand-logo">
      <span class="logo-icon">💰</span> Expense App
    </a>
    <nav class="nav-links">
      @if (authService.currentUser(); as user) {
        <span class="user-email">{{ user.email }}</span>
        <button type="button" class="logout-btn" (click)="logout()">Đăng xuất</button>
      } @else {
        <a routerLink="/login" class="nav-link">Đăng nhập</a>
        <a routerLink="/register" class="nav-link nav-btn">Đăng ký</a>
      }
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
